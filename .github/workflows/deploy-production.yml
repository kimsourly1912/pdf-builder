name: Deploy production

on:
  push:
    branches:
      - codex/pdf-studio-self-host
  workflow_dispatch:
    inputs:
      reset_confirmation:
        description: 'Optional destructive reset: type RESET pdf-builder PRODUCTION'
        required: false
        type: string

concurrency:
  # This repository intentionally has one Cloudflare production target.
  # Local wrangler.dev.jsonc resources are never deployed.
  group: pdf-builder-production
  cancel-in-progress: false

permissions:
  contents: read
  statuses: write

jobs:
  deploy:
    name: Validate and deploy
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Used only to create or verify the single production owner.
      OWNER_PASSWORD: ${{ secrets.PDF_BUILDER_OWNER_PASSWORD || secrets.OWNER_PASSWORD }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      MANAGEMENT_EMAIL: admin@gmail.com

    steps:
      - name: Report deployment start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -n \
            --arg state "pending" \
            --arg context "cloudflare/production" \
            --arg description "Production deployment is running" \
            '{state: $state, context: $context, description: $description}' \
          | curl --fail-with-body \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              --data-binary @-

      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate migrations locally
        run: npm run db:migrate:local

      - name: Test production build
        run: npm test

      - name: Reset production data when explicitly requested
        if: github.event_name == 'workflow_dispatch' && inputs.reset_confirmation == 'RESET pdf-builder PRODUCTION'
        env:
          RESET_CONFIRMATION: ${{ inputs.reset_confirmation }}
        run: node scripts/reset-production.mjs

      - name: Provision and deploy production
        run: node scripts/deploy-production.mjs

      - name: Report deployment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            STATE="success"
            DESCRIPTION="Production deployment verified"
          else
            STATE="failure"
            DESCRIPTION="Production deployment failed"
          fi

          jq -n \
            --arg state "$STATE" \
            --arg context "cloudflare/production" \
            --arg description "$DESCRIPTION" \
            --arg target_url "${PRODUCTION_URL:-}" \
            '{state: $state, context: $context, description: $description}
             + if $target_url == "" then {} else {target_url: $target_url} end' \
          | curl --fail-with-body \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              --data-binary @-
