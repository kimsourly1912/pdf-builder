name: Deploy production

on:
  push:
    branches:
      - codex/pdf-studio-self-host
  workflow_dispatch:

concurrency:
  # This repository intentionally has one Cloudflare production target.
  group: pdf-builder-production
  cancel-in-progress: false

permissions:
  contents: read
  statuses: write

jobs:
  deploy:
    name: Validate and deploy
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MANAGEMENT_EMAIL: kimsur61@gmail.com

    steps:
      - name: Report deployment start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -n \
            --arg state "pending" \
            --arg context "cloudflare/production" \
            --arg description "Production deployment is running" \
            '{state: $state, context: $context, description: $description}' \
          | curl --fail-with-body \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              --data-binary @-

      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test production build
        run: npm test

      - name: Provision and deploy production
        run: node scripts/deploy-production.mjs

      - name: Report deployment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            STATE="success"
            DESCRIPTION="Production deployment verified"
          else
            STATE="failure"
            DESCRIPTION="Production deployment failed"
          fi

          jq -n \
            --arg state "$STATE" \
            --arg context "cloudflare/production" \
            --arg description "$DESCRIPTION" \
            --arg target_url "${PRODUCTION_URL:-}" \
            '{state: $state, context: $context, description: $description}
             + if $target_url == "" then {} else {target_url: $target_url} end' \
          | curl --fail-with-body \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              --data-binary @-
